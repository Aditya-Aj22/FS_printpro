<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast&Secure_PrintSolution</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800">

  <div class="max-w-md mx-auto p-4">

    <!-- Header -->
    <h1 class="text-2xl font-bold text-center mb-6">
      📄 PDF Print System
    </h1>

    <!-- Merge Section -->
    <div class="bg-white rounded-2xl shadow p-4 mb-4">
      <h2 class="text-lg font-semibold mb-3">Merge & Save</h2>

      <input 
        type="file" 
        id="files" 
        multiple 
        accept="application/pdf"
        class="w-full text-sm border rounded-lg p-2 mb-3"
      >

      <div id="fileList" class="space-y-3"></div>

      <button 
        onclick="merge()" 
        class="w-full bg-blue-500 text-white py-2 rounded-lg mt-3 active:scale-95">
        Merge & Save
      </button>
    </div>

    <!-- Saved Files -->
    <div class="bg-white rounded-2xl shadow p-4 mb-4">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-semibold">Saved Files</h2>
        <button 
          onclick="showfiles()" 
          class="text-sm bg-gray-200 px-3 py-1 rounded-lg">
          Refresh
        </button>
      </div>

      <div id="OFiles" class="space-y-3"></div>
    </div>

    <!-- Get PDF -->
    <div class="bg-white rounded-2xl shadow p-4">
      <h2 class="text-lg font-semibold mb-3">Print from Code</h2>

      <div class="flex gap-2">
        <input 
          type="text" 
          id="codeInput" 
          placeholder="Enter code"
          class="flex-1 border rounded-lg p-2 text-sm"
        >
        <button 
          onclick="getFile()" 
          class="bg-green-500 text-white px-4 rounded-lg active:scale-95">
          Get
        </button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="main.js"></script>

</body>
</html>
